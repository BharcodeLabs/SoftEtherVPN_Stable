name: Build SoftEther Windows x86

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win32:
    name: Build Windows x86
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "===== WINDOWS ====="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "===== VISUAL STUDIO ====="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found."
          }

          & $vswhere -products * -property installationPath

          Write-Host ""
          Write-Host "===== MSVC INSTALLATION ====="

          & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

      - name: Configure MSVC x86 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = (& $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()

          if (-not $vsPath) {
            throw "Visual Studio C++ x86/x64 tools were not found."
          }

          Write-Host "Visual Studio path:"
          Write-Host $vsPath

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"

          if (-not (Test-Path $vcvars)) {
            throw "vcvarsall.bat not found: $vcvars"
          }

          Write-Host "Loading x86 compiler environment..."

          $envOutput = cmd.exe /c "`"$vcvars`" x86 && set"

          foreach ($line in $envOutput) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]

              # Don't overwrite GitHub's internal variables.
              if ($name -notmatch '^GITHUB_' -and
                  $name -notmatch '^RUNNER_') {
                "$name=$value" | Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8
              }
            }
          }

      - name: Verify x86 compiler
        shell: cmd
        run: |
          echo ===== CL.EXE =====
          where cl
          cl

          echo.
          echo ===== LINK.EXE =====
          where link
          link

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
          )

          $msbuild = $candidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild.exe not found."
          }

          Write-Host "MSBuild:"
          Write-Host $msbuild

          & $msbuild -version

          "MSBUILD_EXE=$msbuild" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Build SoftEther BuildUtil
        shell: cmd
        run: |
          echo ===== BUILDUTIL =====

          if exist src\bin\BuildUtil.exe (
            del /f /q src\bin\BuildUtil.exe
          )

          "%MSBUILD_EXE%" ^
            src\BuildUtil\BuildUtil.csproj ^
            /t:Rebuild ^
            /p:Configuration=Debug ^
            /p:Platform=AnyCPU ^
            /verbosity:normal

      - name: Run SoftEther build
        shell: cmd
        run: |
          echo ===== SOFTETHER BUILD =====

          if not exist src\bin\BuildUtil.exe (
            echo BuildUtil.exe was not produced.
            exit /b 1
          )

          src\bin\BuildUtil.exe /CMD:All

      - name: Inspect build output
        if: always()
        shell: pwsh
        run: |
          Write-Host "===== OUTPUT ====="

          if (Test-Path output) {
            Get-ChildItem output -Recurse -File |
              Select-Object FullName, Length
          }
          else {
            Write-Host "output directory does not exist."
          }

          Write-Host ""
          Write-Host "===== SRC BIN ====="

          if (Test-Path src\bin) {
            Get-ChildItem src\bin -Recurse -File |
              Select-Object FullName, Length
          }

      - name: Verify x86 executables
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem . -Recurse -File `
            -Include vpnserver.exe,vpncmd.exe,vpnbridge.exe,vpnclient.exe `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            Write-Host "No expected SoftEther executables found."
            exit 1
          }

          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)

            if ($bytes.Length -lt 64) {
              throw "$($file.FullName) is too small."
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)

            $signature = [System.Text.Encoding]::ASCII.GetString(
              $bytes,
              $peOffset,
              4
            )

            $machine = [BitConverter]::ToUInt16(
              $bytes,
              $peOffset + 4
            )

            Write-Host ""
            Write-Host "File: $($file.FullName)"
            Write-Host "PE: $signature"
            Write-Host ("Machine: 0x{0:X4}" -f $machine)

            if ($signature -ne "PE`0`0") {
              throw "$($file.FullName) is not a valid PE executable."
            }

            # 0x014C = Intel 386 / x86
            if ($machine -ne 0x014c) {
              throw "$($file.FullName) is NOT x86."
            }

            Write-Host "Architecture: x86 ✓"
          }

      - name: Package build
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          if (Test-Path output) {
            Copy-Item output artifacts\output -Recurse -Force
          }

          if (Test-Path src\bin) {
            New-Item -ItemType Directory -Force -Path artifacts\bin | Out-Null

            Get-ChildItem src\bin -File |
              Copy-Item -Destination artifacts\bin -Force
          }

          Compress-Archive `
            -Path artifacts\* `
            -DestinationPath SoftEther-Win32-Build.zip `
            -Force

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoftEther-Win32-Build
          path: SoftEther-Win32-Build.zip
          if-no-files-found: error
          retention-days: 7
